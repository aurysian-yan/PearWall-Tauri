[package]
name = "pearwall-desktop"
version = "0.1.0"
description = "Pear Wall desktop runtime"
authors = ["Pear Wall"]
edition = "2021"

[lib]
name = "pearwall_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
pearwall-core = { package = "pearwall-core", path = "../../native/pearwall-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
windows-future = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSScreen", "NSWorkspace"] }
screencapturekit = { version = "8.0.1", features = ["macos_13_0"] }

[profile.release]
strip = false
