[package]
name = "pearwall-desktop"
version = "0.1.1"
description = "Pear Wall desktop runtime"
authors = ["Pear Wall"]
edition = "2021"
default-run = "pearwall-desktop"

[lib]
name = "pearwall_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
pearwall-core = { package = "pearwall-core", path = "../../native/pearwall-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
windows-future = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
fs2 = "0.4"
memmap2 = "0.9"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSScreen", "NSWindow", "NSWorkspace"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGWindowLevel", "libc"] }

[profile.release]
strip = false
