[package]
name = "pearwall-wallpaper"
version = "0.1.0"
edition = "2021"
links = "pearwall-wallpaper"

[lib]
name = "pearwall_wallpaper"
crate-type = ["rlib"]

[features]
default = []
macos-native = ["dep:swift-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
swift-rs = { version = "1.0.8", features = ["build"], optional = true }
tauri-plugin = { version = "2", features = ["build"] }
