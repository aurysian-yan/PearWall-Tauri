name: Release desktop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pearwall-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Detect version change
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version="$(node desktop/scripts/version.mjs --check)"
          tag="v${version}"
          should_release=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            should_release=true
          elif git cat-file -e "${BEFORE_SHA}:desktop/package.json" 2>/dev/null; then
            previous_version="$(git show "${BEFORE_SHA}:desktop/package.json" | node -e 'let input="";process.stdin.on("data",chunk=>input+=chunk);process.stdin.on("end",()=>process.stdout.write(JSON.parse(input).version))')"
            if [[ "$previous_version" != "$version" ]]; then
              should_release=true
            fi
          fi

          if [[ "$should_release" == "true" ]] && git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::${tag} 已存在，请更新版本号后再发布。"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Windows and macOS
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-pc-windows-msvc

      - name: Restore Rust and cross-compiler cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-xwin
            ~/Library/Caches/cargo-xwin
            desktop/src-tauri/target
            desktop/installer/src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-xwin-0.22.0-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/installer/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-xwin-0.22.0-

      - name: Install build dependencies
        shell: bash
        run: |
          brew install llvm create-dmg
          if ! command -v cargo-xwin >/dev/null 2>&1; then
            cargo install --locked cargo-xwin --version 0.22.0
          fi
          pnpm --dir desktop install --frozen-lockfile

      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/pearwall-apple.p12"
          keychain_path="$RUNNER_TEMP/pearwall-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p actions "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p actions "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k actions "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F '"' '/Developer ID Application/{print $2; exit}')"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::证书中没有 Developer ID Application 身份。"
            exit 1
          fi
          echo "PEARWALL_CODESIGN_IDENTITY=${signing_identity}" >> "$GITHUB_ENV"

      - name: Warn about unsigned packages
        if: env.APPLE_CERTIFICATE_BASE64 == ''
        run: echo "::warning::未配置 Apple 签名证书，将生成 ad hoc 签名的 macOS 包和未签名的 Windows 包。"

      - name: Check notarization credentials
        if: env.APPLE_CERTIFICATE_BASE64 != '' && (env.APPLE_ID == '' || env.APPLE_APP_SPECIFIC_PASSWORD == '' || env.APPLE_TEAM_ID == '')
        run: |
          echo "::error::配置 Apple 证书后还必须配置 APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD 和 APPLE_TEAM_ID。"
          exit 1

      - name: Check unified build environment
        run: pnpm --dir desktop build:screen-savers:check

      - name: Build Windows and macOS packages
        run: pnpm --dir desktop build:screen-savers

      - name: Sign and notarize disk image
        if: env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        shell: bash
        run: |
          dmg_path="desktop/build/release/macos/Pear-Wall-Screen-Saver-${VERSION}.dmg"
          codesign --force --sign "$PEARWALL_CODESIGN_IDENTITY" --timestamp "$dmg_path"
          xcrun notarytool submit "$dmg_path" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"

      - name: Package standalone macOS bundles
        shell: bash
        run: |
          output="desktop/build/release/macos"
          ditto -c -k --sequesterRsrc --keepParent "$output/Pear Wall.app" "$output/Pear-Wall-${VERSION}-macOS-arm64.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$output/Pear Wall.saver" "$output/Pear-Wall-${VERSION}-macOS-arm64.saver.zip"

      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: pearwall-release-${{ needs.prepare.outputs.version }}
          path: |
            desktop/build/release/windows/Pear-Wall-Screen-Saver-${{ needs.prepare.outputs.version }}-setup.exe
            desktop/build/release/macos/Pear-Wall-Screen-Saver-${{ needs.prepare.outputs.version }}.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: pearwall-release-${{ needs.prepare.outputs.version }}
          path: release

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Generate release notes from commits
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [[ -n "$previous_tag" ]]; then
            commit_range="${previous_tag}..${GITHUB_SHA}"
          else
            commit_range="$GITHUB_SHA"
          fi

          declare -A sections=(
            [新增]=""
            [修复]=""
            [优化]=""
            [重构]=""
            [文档]=""
            [其他]=""
          )

          while IFS=$'\t' read -r hash subject; do
            [[ -z "$hash" ]] && continue

            case "$subject" in
              upgrade*|actions*) continue ;;
            esac

            case "$subject" in
              feat:*|feat\(*\):*|feature:*|新增*) section="新增" ;;
              fix:*|fix\(*\):*|bugfix:*|修复*) section="修复" ;;
              perf:*|perf\(*\):*|优化*) section="优化" ;;
              refactor:*|refactor\(*\):*|重构*) section="重构" ;;
              docs:*|docs\(*\):*|文档*) section="文档" ;;
              *) section="其他" ;;
            esac

            short_hash="${hash:0:7}"
            commit_link="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${hash}"
            sections["$section"]+="- ${subject} ([${short_hash}](${commit_link}))"$'\n'
          done < <(git log --no-merges --pretty=format:'%H%x09%s' "$commit_range")

          {
            echo "## 更新日志"
            echo
            if [[ -n "$previous_tag" ]]; then
              echo "本次更新包含 `${previous_tag}..${TAG}` 之间的提交。"
            else
              echo "本次更新包含项目历史提交。"
            fi

            for section in 新增 修复 优化 重构 文档 其他; do
              if [[ -n "${sections[$section]}" ]]; then
                echo
                echo "### ${section}"
                printf '%s' "${sections[$section]}"
              fi
            done
          } > release-notes.md

      - name: Create release
        shell: bash
        run: |
          mapfile -d '' assets < <(find release -type f -print0 | sort -z)
          gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Pear Wall ${TAG}" --notes-file release-notes.md
